name: Test

on:
  pull_request:

permissions: {}

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        experimental: [false]
        include:
          - python-version: '3.15-dev'
            # sets continue-on-error automatically
            experimental: true

    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      # memray sometimes lags on shipping -dev binaries,
      # so install these to build from source when that happens.
      # https://github.com/bloomberg/memray#building-from-source
      - name: Install memray build dependencies for Python -dev versions
        if: endsWith(matrix.python-version, '-dev')
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
            sudo apt-get update --yes && \
            sudo apt-get install --yes --no-install-recommends \
              libunwind-dev \
              liblz4-dev \
              libdebuginfod-dev

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip wheel
            python -m pip install tox tox-gh-actions

      - name: Test with tox
        run: |
          export PYTHONFAULTHANDLER=1
          tox
